<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A3 演示台 · 记忆 + 非遗文化</title>
<style>
  :root{
    --bg:#F6F7F9; --card:#FFFFFF; --ink:#1F2937; --muted:#6B7280; --line:#E5E7EB;
    --blue:#2563EB; --blue-bg:#EFF6FF;
    --ok:#15803D; --ok-bg:#DCFCE7;
    --warn:#B45309; --warn-bg:#FEF3C7;
    --err:#B91C1C; --err-bg:#FEE2E2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.65}
  header{padding:20px 28px 14px;border-bottom:1px solid var(--line);background:var(--card)}
  h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.2px}
  .sub{margin-top:4px;font-size:13px;color:var(--muted)}
  .bar{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;
    font-size:13px;font-weight:500;border:1px solid transparent}
  .pill.on{background:var(--ok-bg);color:var(--ok);border-color:#86EFAC}
  .pill.off{background:var(--warn-bg);color:var(--warn);border-color:#FCD34D}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
  input[type=text]{padding:5px 10px;border:1px solid var(--line);border-radius:8px;
    font-size:13px;width:190px;font-family:inherit;color:var(--ink)}
  button{font-family:inherit}
  button.ghost{padding:5px 12px;border:1px solid var(--line);background:var(--card);
    border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink)}
  button.ghost:hover{border-color:#C7CBD1}

  nav{display:flex;gap:4px;padding:12px 28px 0;background:var(--card);
    border-bottom:1px solid var(--line);overflow-x:auto}
  nav button{padding:9px 18px;border:none;background:transparent;cursor:pointer;
    font-size:15px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
  nav button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}

  main{padding:22px 28px 48px;max-width:1180px;margin:0 auto}
  section{display:none}
  section.active{display:block}
  .grid{display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:start}
  @media(max-width:840px){.grid{grid-template-columns:1fr}}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .panel h2{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.6px}

  .scen{display:flex;flex-direction:column;gap:6px}
  .scen button{text-align:left;padding:9px 12px;border:1px solid var(--line);
    background:var(--card);border-radius:9px;cursor:pointer;font-size:14px;color:var(--ink)}
  .scen button:hover{background:#F9FAFB}
  .scen button.on{border-color:var(--blue);background:var(--blue-bg);color:#1D4ED8;font-weight:500}
  .scen small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}

  .say{margin-bottom:14px}
  .bubble{padding:11px 15px;border-radius:12px;max-width:86%;font-size:15px}
  .bubble.old{background:#F3F4F6;border:1px solid var(--line);margin-left:auto}
  .bubble.bot{background:var(--blue-bg);border:1px solid #BFDBFE}
  .who{font-size:12px;color:var(--muted);margin-bottom:4px}
  .who.r{text-align:right}

  .tag{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;
    font-weight:500;margin-right:6px}
  .tag.ok{background:var(--ok-bg);color:var(--ok)}
  .tag.warn{background:var(--warn-bg);color:var(--warn)}
  .tag.err{background:var(--err-bg);color:var(--err)}
  .tag.info{background:var(--blue-bg);color:var(--blue)}
  .tag.mute{background:#F3F4F6;color:var(--muted)}

  .course{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
  .course .t{font-size:16px;font-weight:600}
  .course .v{font-size:13px;color:var(--muted);margin-top:2px}
  .facts{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px}
  .facts span{color:var(--muted)}
  .facts b{color:var(--ink);font-weight:500}
  .why{margin-top:8px;font-size:12px;color:var(--blue)}

  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:500;font-size:12px;width:34%}
  td code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}

  .big{font-size:22px;font-weight:600;margin:6px 0}
  .kv{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
  .mem{border-left:3px solid var(--line);padding:7px 0 7px 12px;margin-top:8px}
  .mem.hit{border-left-color:var(--ok)}
  .mem.drop{border-left-color:#D1D5DB;opacity:.62}
  .mem .k{font-size:12px;color:var(--muted)}
  pre{background:#0F172A;color:#E2E8F0;padding:14px;border-radius:10px;overflow:auto;
    font-size:12.5px;line-height:1.55;font-family:ui-monospace,Consolas,monospace;margin:8px 0 0}
  .note{font-size:13px;color:var(--muted);margin-top:12px;padding-top:12px;
    border-top:1px dashed var(--line)}
  .empty{color:var(--muted);font-size:14px;padding:24px 0;text-align:center}
  .err-box{background:var(--err-bg);border:1px solid #FCA5A5;border-radius:10px;
    padding:12px 14px;font-size:14px;color:var(--err)}
  .opt{display:inline-block;padding:6px 14px;border:1px solid #BFDBFE;background:#fff;
    border-radius:999px;font-size:14px;margin:6px 8px 0 0;color:#1D4ED8}
</style>
</head>
<body>

<header>
  <h1>A3 演示台 · 记忆 · 非遗文化 · 能力银行</h1>
  <div class="sub">按 v3 协议对接 P2 的真实服务。场景全部走本地 HTTP，不是预录动画。</div>
  <div class="bar">
    <span class="pill off" id="mode"><span class="dot"></span><span id="modeText">检测中…</span></span>
    <input type="text" id="base" value="http://127.0.0.1:18003">
    <button class="ghost" id="recheck">重新检测</button>
    <span class="sub" id="hint" style="margin:0"></span>
  </div>
</header>

<nav>
  <button class="active" data-tab="culture">文化问答与课程</button>
  <button data-tab="review">记忆审核</button>
  <button data-tab="search">检索四态</button>
  <button data-tab="raw">报文原文</button>
</nav>

<main>
  <section id="tab-culture" class="active">
    <div class="grid">
      <div class="panel"><h2>老人说的话</h2><div class="scen" id="cultureScen"></div></div>
      <div class="panel"><h2>系统怎么答</h2><div id="cultureOut"><div class="empty">点左边任一句试试</div></div></div>
    </div>
  </section>

  <section id="tab-review">
    <div class="grid">
      <div class="panel"><h2>审核情形</h2><div class="scen" id="reviewScen"></div></div>
      <div class="panel"><h2>审核结论</h2><div id="reviewOut"><div class="empty">点左边任一种情况试试</div></div></div>
    </div>
  </section>

  <section id="tab-search">
    <div class="grid">
      <div class="panel"><h2>检索情形</h2><div class="scen" id="searchScen"></div></div>
      <div class="panel"><h2>检索结果</h2><div id="searchOut"><div class="empty">点左边任一种情况试试</div></div></div>
    </div>
  </section>

  <section id="tab-raw">
    <div class="panel">
      <h2>最近一次请求</h2>
      <pre id="rawReq">（还没发起调用）</pre>
      <h2 style="margin-top:18px">最近一次响应</h2>
      <pre id="rawRes">（还没发起调用）</pre>
      <div class="note">这里显示的是发出去和收回来的原始 JSON。切换 tab 不会清空，方便对着报文讲。</div>
    </div>
  </section>
</main>

<script>
const SNAPSHOT = JSON.parse(document.getElementById('snapshot').textContent);
const $ = id => document.getElementById(id);
let ONLINE = false;

function esc(s){return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function raw(req, res){
  $('rawReq').textContent = req ? JSON.stringify(req, null, 2) : '—';
  $('rawRes').textContent = res ? JSON.stringify(res, null, 2) : '—';
}

function setMode(online, extra){
  ONLINE = online;
  $('mode').className = 'pill ' + (online ? 'on' : 'off');
  $('modeText').textContent = online ? '在线 · 真实调用本地服务' : '离线 · 用真实运行快照';
  $('hint').textContent = online
    ? '所有操作都会真的发 HTTP 请求'
    : (extra || '服务没起，下面是上次真实运行抓下来的结果，不是编的');
}

async function check(){
  const base = $('base').value.replace(/\/$/, '');
  try{
    const r = await fetch(base + '/health', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    setMode(true);
    $('hint').textContent = `服务 ${j.data.status} · 协议 ${j.data.protocolVersion} · 审核 ${j.data.capabilities.memoryCandidateReview ? '已接' : '未接'}`;
  }catch(e){
    setMode(false);
  }
}

async function api(path, body){
  const base = $('base').value.replace(/\/$/, '');
  raw(body, null);
  const r = await fetch(base + path, {
    method:'POST',
    headers:{'Content-Type':'application/json; charset=utf-8'},
    body: JSON.stringify(body)
  });
  const j = await r.json();
  raw(body, j);
  return {status:r.status, body:j};
}

/* ---------- 构造请求（和 Python 端 _sample_body 保持同一形状） ---------- */
function invocation(text, id){
  const dl = new Date(Date.now() + 3600e3).toISOString().replace(/\.\d+Z$/, 'Z');
  return {
    protocolVersion:'3.0', userId:'u100', conversationId:'conv-001', messageId:'msg-001',
    task:{id:'child-003', parentTaskId:'root-001', version:2, attempt:1,
          invocationId:id, deadlineAt:dl},
    input:{text, attachmentIds:[]},
    context:{businessRefs:[], history:[], completedEffects:[], reason:'USER_MESSAGE',
             candidateTasks:[], dependencyResults:[], confirmationResults:[],
             actionLedger:[], planSteps:[],
             readSet:{memoryRevision:7, authorizationRevision:3, provenanceRefs:[]},
             inputResponse:null, pendingInputRequests:[]},
    capabilityToken:'DEMO-TOKEN-NOT-A-REAL-CREDENTIAL'
  };
}

function reviewInvocation(cand, id){
  const b = invocation('审核这条候选', id);
  b.context.reason = 'CHILDREN_FINISHED';
  b.context.dependencyResults = [{
    taskId:'child-010', parentTaskId:'root-001', targetAgent:'a2', domain:'culture',
    required:true, version:1, status:'SUCCEEDED',
    reply:{text:'候选已生成', speechRate:0.9, audioUrl:null},
    results:[{resultId:'cand-result-1', type:'MEMORY_CANDIDATE', schemaVersion:'1.0',
      title:'候选', businessRef:null, availability:'DEMO',
      generatedAt:'2026-11-04T00:00:00Z', sources:[], pendingChecks:[], payload:cand}],
    inputRequest:null, confirmationIds:[], effectIds:[], error:null,
    completedAt:'2026-11-04T00:00:00Z'
  }];
  return b;
}

const uid = () => 'invoke-' + Math.random().toString(16).slice(2,10);

/* ---------- 文化课 ---------- */
function renderCulture(entry){
  const out = $('cultureOut');
  const {status, body} = entry;
  let html = `<div class="say"><div class="who r">老人说</div>
    <div class="bubble old">${esc(entry.text)}</div></div>`;

  if(status !== 200){
    out.innerHTML = html + `<div class="err-box"><b>${status} ${esc(body.code)}</b><br>${esc(body.message)}</div>
      <div class="note">不在 A3 负责的领域里，就明确说不接 —— 让 A2 去答，比给一句错的强。</div>`;
    return;
  }
  const d = body.data;
  html += `<div class="who">系统答</div><div class="bubble bot">${esc(d.reply.text)}</div>`;

  const tags = [`<span class="tag ${d.control.next==='COMPLETE'?'ok':'info'}">${d.control.next}</span>`];
  if(d.control.outcome) tags.push(`<span class="tag mute">${d.control.outcome}</span>`);
  tags.push(`<span class="tag mute">intent: ${d.intent}</span>`);
  html += `<div style="margin-top:12px">${tags.join('')}</div>`;

  if(d.control.next === 'WAIT_INPUT' && d.control.inputRequest){
    const q = d.control.inputRequest;
    html += `<div class="note">信息不够，问一次，不硬猜。问题号是程序生成的 UUID v4：<code>${esc(q.inputRequestId)}</code></div>
      <div style="margin-top:8px">${q.options.map(o=>`<span class="opt">${esc(o.label)}</span>`).join('')}</div>`;
  }

  const card = (d.results || [])[0];
  if(card && (card.payload.courses || []).length === 0 && !card.payload.entries && !card.payload.skill){
    html += `<div class="note">卡片：${esc(card.title)} · availability = <b>${esc(card.availability)}</b></div>
      <div class="empty" style="padding:16px 0">这张卡片是空的 —— 那就直说没有，不拿不相关的凑数</div>`;
  }
  if(card && card.payload.entries){
    const entries = card.payload.entries;
    html += `<div class="note">卡片：${esc(card.title)} · availability = <b>${esc(card.availability)}</b> · 条目 ${entries.length} 条</div>`;
    if(!entries.length){
      html += `<div class="empty" style="padding:16px 0">库里没有 → 直说没有，绝不顺着话头编一段</div>`;
    }
    entries.forEach(e=>{
      html += `<div class="course">
        <div class="t">${esc(e.title)}</div>
        <div class="v">${esc(e.topic)} · ${esc((e.regions||[]).join(' / '))}</div>
        <div style="margin-top:8px;font-size:14px">${esc(e.content)}</div>
        <div class="why" style="color:#5F5E5A;margin-top:8px">来源：${esc(e.source.org)} · ${esc(e.source.title)}</div>
      </div>`;
    });
  }
  if(card && card.payload.skill){
    const sk = card.payload.skill, na = card.payload.nextAction || {};
    html += `<div class="note">卡片：${esc(card.title)} · availability = <b>${esc(card.availability)}</b></div>
      <div class="course">
        <div class="t">${esc(sk.skillName)} · ${esc(sk.willingnessLabel)}</div>
        <div class="facts">
          <span>每周 <b>${sk.weeklySlots}</b> 个时段</span>
          <span>状态 <b>${esc(sk.state)}</b></span>
        </div>
        <div class="why">下一步：${esc(na.stageLabel)}，该 <b>${esc(na.owner)}</b> 做 —— ${esc(na.todo)}</div>
        <div class="why" style="color:#B45309">A3 能不能自己推进：${na.a3CanAdvance ? '能' : '不能，审核必须社区/平台做'}</div>
      </div>`;
  }
  const items = (card && card.payload.courses) || [];
  if(card && items.length){
    html += `<div class="note">卡片：${esc(card.title)} · availability = <b>${esc(card.availability)}</b> · businessRef = <b>${card.businessRef===null?'null':'有'}</b></div>`;
    items.forEach(c=>{
      const s = c.nextSession || {};
      html += `<div class="course">
        <div class="t">${esc(c.title)}</div>
        <div class="v">${esc(c.venue)}</div>
        <div class="facts">
          <span>走路 <b>${c.walkMinutes}</b> 分钟</span>
          <span>时长 <b>${c.durationMin}</b> 分钟</span>
          <span><b>${esc(s.weekdayLabel||'')} ${esc((s.startAt||'').slice(11,16))}</b></span>
          <span>名额 <b>${c.seatsLeft}</b></span>
          <span>${c.hasSteps ? '<b style="color:#B45309">要爬台阶</b>' : '无台阶'}</span>
        </div>
        ${(c.reasons||[]).length ? `<div class="why">为什么排这个位置：${c.reasons.map(esc).join(' · ')}</div>` : ''}
      </div>`;
    });
  }
  out.innerHTML = html;
}

/* ---------- 记忆审核 ---------- */
const REC_LABEL = {ADD:'新增', KEEP:'保留', MERGE:'合并', REPLACE:'替换', REJECT:'拒绝'};
function renderReview(entry){
  const out = $('reviewOut');
  const {status, body} = entry;
  if(status !== 200){
    out.innerHTML = `<div class="err-box"><b>${status} ${esc(body.code)}</b><br>${esc(body.message)}</div>
      <div class="note">这一条是全场最值钱的：读不到记忆库就报错，<b>不蒙一个「建议新增」</b>。
      蒙错了会让同一件事存两遍，比不答更糟。</div>`;
    return;
  }
  const d = body.data;
  const p = d.results[0].payload;
  const cls = p.recommendation === 'REJECT' ? 'warn' : (p.recommendation === 'KEEP' ? 'mute' : 'ok');

  let html = `<div class="big"><span class="tag ${cls}" style="font-size:18px;padding:6px 14px">${esc(p.recommendation)} ${REC_LABEL[p.recommendation]||''}</span></div>
    <div class="kv">
      <span>要不要老人点头：<b>${p.needsUserConfirmation ? '要' : '不要'}</b></span>
      <span>候选：<code>${esc(p.candidateId)}</code> v${p.candidateVersion}</span>
      <span>审核号：<code>${esc(p.reviewId).slice(0,18)}…</code></span>
    </div>
    <div class="say" style="margin-top:14px"><div class="who">系统对老人说</div>
    <div class="bubble bot">${esc(d.reply.text)}</div></div>
    <div class="note">${esc(p.explanation)}</div>`;

  if((p.conflictMemoryRefs||[]).length){
    html += `<div class="note">撞上的已有记忆：${p.conflictMemoryRefs.map(r=>`<code>${esc(r.memoryId)}</code> v${r.version}`).join('、')}
      —— 这些也登记进了 usedMemoryRefs，P2 可追溯依据。</div>`;
  }

  html += `<h2 style="margin:18px 0 0;font-size:13px;font-weight:600;color:var(--muted)">九字段（协议要求正好九个）</h2>
    <table>${Object.entries(p).map(([k,v])=>{
      let val = Array.isArray(v) ? (v.length ? v.map(x=>typeof x==='object'?JSON.stringify(x):x).join(', ') : '（空）') : String(v);
      if(k==='explanation') val = val.slice(0,90) + (val.length>90?'…':'');
      return `<tr><th>${esc(k)}</th><td><code>${esc(val)}</code></td></tr>`;
    }).join('')}</table>
    <div class="note">确认号 confirmationIds = <code>[${(d.confirmationIds||[]).join(',')}]</code> —— A3 不生成确认号，确认由 A1 准备、P2 执行。</div>`;
  out.innerHTML = html;
}

/* ---------- 检索四态 ---------- */
function renderSearch(entry){
  const out = $('searchOut');
  const {status, body} = entry;
  let head = '';
  if(status === 200){
    const d = body.data;
    const hit = d.readStatus === 'AVAILABLE';
    head = `<div class="big"><span class="tag ${hit?'ok':'mute'}" style="font-size:17px;padding:6px 14px">200 · ${esc(d.readStatus)}</span></div>
      <div class="kv"><span>给了 <b>${d.items.length}</b> 条</span>
      <span>实用 <b>${d.returnedContentChars}</b> 字</span>
      <span>truncated：<b>${d.truncated}</b></span>
      <span>memoryRevision：<b>${d.memoryRevision}</b></span></div>`;
  }else{
    const cls = status === 403 ? 'warn' : 'warn';
    head = `<div class="big"><span class="tag ${cls}" style="font-size:17px;padding:6px 14px">${status} · ${esc(body.code)}</span></div>
      <div class="err-box" style="margin-top:10px">${esc(body.message)}</div>`;
  }

  const returned = new Set(((body.data && body.data.items) || []).map(i=>i.memoryId));
  let list = '';
  (SNAPSHOT.memories || []).forEach(m=>{
    const hit = returned.has(m.memoryId);
    const drop = hit ? '' : (m.state !== 'ACTIVE' ? `state=${m.state}，不返回`
                      : (m.sensitivity === 'SENSITIVE' ? '敏感且未授权，不返回' : '关键词没命中，不返回'));
    list += `<div class="mem ${hit?'hit':'drop'}">
      <div><code>${esc(m.memoryId)}</code> ${hit?'<span class="tag ok">返回</span>':'<span class="tag mute">过滤</span>'}
      ${hit?'':`<span style="font-size:12px;color:var(--muted)">${esc(drop)}</span>`}</div>
      <div>${esc(m.content)}</div>
      <div class="k">${esc(m.key)} · ${esc(m.domains.join('/'))} · ${esc(m.sensitivity)} · ${esc(m.state)}</div>
    </div>`;
  });

  out.innerHTML = head + `<div class="note">${esc(entry.note)}</div>
    <h2 style="margin:16px 0 0;font-size:13px;font-weight:600;color:var(--muted)">库里这 5 条记忆，谁被返回、谁被挡住</h2>
    ${list}`;
}

/* ---------- 场景按钮 ---------- */
function buildScene(containerId, items, onPick, labelOf){
  const box = $(containerId);
  box.innerHTML = '';
  items.forEach((item, i)=>{
    const b = document.createElement('button');
    b.innerHTML = `${esc(labelOf(item))}<small>${esc(item.note || '')}</small>`;
    b.onclick = ()=>{
      [...box.children].forEach(c=>c.classList.remove('on'));
      b.classList.add('on');
      onPick(item, i);
    };
    box.appendChild(b);
  });
  if(box.firstChild) box.firstChild.click();
}

async function pickCulture(item, i){
  let entry = item;
  if(ONLINE){
    try{
      const {status, body} = await api('/internal/v3/messages', invocation(item.text, uid()));
      entry = {text:item.text, note:item.note, status, body};
    }catch(e){
      setMode(false, '调用失败（' + e.message + '），已切回快照');
      entry = item;
    }
  }
  renderCulture(entry);
}

const CAND = {candidateId:'cand-001', candidateVersion:1, category:'LONG_TERM_PREFERENCE',
              key:'culture.interests', content:'喜欢剪纸和刺绣',
              domains:['culture'], sensitivity:'GENERAL'};
const REVIEW_CANDS = [CAND, CAND, CAND, CAND,
                      Object.assign({}, CAND, {sensitivity:'SENSITIVE'}), CAND];

async function pickReview(item, i){
  let entry = item;
  if(ONLINE){
    try{
      const {status, body} = await api('/internal/v3/messages', reviewInvocation(REVIEW_CANDS[i], uid()));
      entry = {label:item.label, note:item.note, status, body};
    }catch(e){
      setMode(false, '调用失败（' + e.message + '），已切回快照');
      entry = item;
    }
  }
  renderReview(entry);
}

async function pickSearch(item){
  let entry = item;
  if(ONLINE){
    try{
      const {status, body} = await api('/internal/demo/memory/search', {
        args:item.args, memories:SNAPSHOT.memories,
        authorizedDomains:item.auth, storeAvailable:item.available,
        memoryRevision:12, authorizationRevision:4
      });
      entry = Object.assign({}, item, {status, body});
    }catch(e){
      setMode(false, '调用失败（' + e.message + '），已切回快照');
      entry = item;
    }
  }
  renderSearch(entry);
}

/* ---------- 初始化 ---------- */
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('section').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    $('tab-' + b.dataset.tab).classList.add('active');
  };
});
$('recheck').onclick = check;

/* 先探活再渲染：否则首屏会在"还不知道在不在线"的时候就把快照画上去，
   等 check 回来又变成在线，状态和内容对不上。 */
(async function init(){
  await check();
  buildScene('cultureScen', SNAPSHOT.culture, pickCulture, x=>x.text);
  buildScene('reviewScen', SNAPSHOT.review, pickReview, x=>x.label);
  buildScene('searchScen', SNAPSHOT.search, pickSearch, x=>x.label);
})();
</script>
