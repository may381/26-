<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>转钱之前，先核一下</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { background:#f4f7f9; font-family:"Microsoft YaHei",sans-serif; color:#1f2933; }
  .wrap { max-width:760px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:26px; margin-bottom:6px; }
  .sub { color:#6b7a8d; font-size:14px; margin-bottom:20px; line-height:1.6; }
  textarea {
    width:100%; min-height:120px; font-size:17px; line-height:1.7; padding:14px 16px;
    border:1.4px solid #cfd9e2; border-radius:10px; font-family:inherit; resize:vertical;
  }
  .row { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  button {
    font-family:inherit; font-size:16px; padding:11px 20px; border-radius:9px;
    border:1.4px solid #cfd9e2; background:#fff; cursor:pointer;
  }
  button.primary { background:#2f6f8f; border-color:#2f6f8f; color:#fff; font-weight:600; }
  button:disabled { opacity:.55; cursor:default; }
  .hint { font-size:13px; color:#8a99a8; margin-top:8px; }
  .card { background:#fff; border-radius:12px; padding:20px 22px; margin-top:22px;
          border:1.4px solid #e3eaf0; box-shadow:0 1px 2px rgba(20,40,60,.05); }
  .card.high { border-color:#e0a48a; background:#fdf6f2; }
  .badge { display:inline-block; font-size:13px; padding:2px 10px; border-radius:20px;
           background:#fbe9e2; color:#a8552f; border:1px solid #e8bda8; margin-left:8px; }
  .card h2 { font-size:19px; margin-bottom:12px; }
  .sec { margin-top:16px; }
  .sec h3 { font-size:15px; color:#3c5a72; margin-bottom:8px; }
  ul, ol { margin:0 0 0 22px; line-height:1.85; font-size:16px; }
  .chs { display:flex; gap:10px; flex-wrap:wrap; }
  .chs div { border:1.2px solid #d7e0e8; border-radius:9px; padding:9px 13px; font-size:15px; background:#fbfdfe; }
  .chs small { display:block; color:#7b8a99; font-size:12.5px; margin-top:3px; }
  .never { font-size:13.5px; color:#8a6a4a; background:#fdf9f4; border:1.2px dashed #ddc4a8;
           border-radius:9px; padding:10px 14px; margin-top:16px; line-height:1.8; }
  .foot { margin-top:14px; font-size:12.5px; color:#93a1b0; line-height:1.7; }
  .ok { color:#3f7a6b; background:#edf7f3; border:1.2px solid #bcdcd0; border-radius:10px;
        padding:16px 18px; font-size:16px; margin-top:22px; }
  .err { color:#a05a48; margin-top:14px; font-size:15px; }
</style>
</head><body>
<div class="wrap">
  <h1>转钱之前，先核一下</h1>
  <p class="sub">把对方的要求原样贴进来，我看看有没有「先交钱」或「要验证码」这类要求。<br>
     这不是警方认定，只是帮你先停一下。</p>

  <textarea id="text" placeholder="例如：您报名的课程可全额退款，请先缴纳2000元保证金，再把验证码发给客服。"></textarea>
  <div class="row">
    <button class="primary" id="go">帮我核对</button>
    <button id="sample">填一条示例</button>
  </div>
  <p class="hint">不监控你的来电和其他 App；只核对你贴进来的这段文字。</p>

  <div id="out"></div>
  <p class="foot">依据：金额先付、索要验证码/卡号/密码、施压话术、冒充客服或公检法。<br>
     系统不会执行任何转账、冻结或追回，也不承诺能追回。</p>
</div>

<script>
const $ = id => document.getElementById(id);
const SAMPLE = "【课程平台客服】您报名的课程因系统升级可全额退款，请添加QQ群办理，先缴纳2000元退款保证金，再把收到的验证码发给客服，逾期视为放弃。";

$("sample").onclick = () => { $("text").value = SAMPLE; $("text").focus(); };

function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

$("go").onclick = async () => {
  const text = $("text").value.trim();
  if (!text) { $("out").innerHTML = '<p class="err">先贴一段对方的要求。</p>'; return; }
  $("go").disabled = true;
  try {
    const response = await fetch("/api/payment-guard", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "核对未完成");
    render(data);
  } catch (error) {
    $("out").innerHTML = '<p class="err">' + esc(error.message) + "；未做任何判断。</p>";
  } finally { $("go").disabled = false; }
};

function render(data) {
  if (!data.triggered) {
    $("out").innerHTML = '<div class="ok">这句话里没发现「先交钱」「要验证码」「被施压」这类要求。<br>'
      + '<span style="font-size:14px;color:#5d7287">没发现不等于绝对安全；拿不准就发给家人一起看。</span></div>';
    return;
  }
  const risk = data.risk === "high" ? "需要立即停下" : "建议先核实";
  const steps = data.pauseSteps.map(s => "<li>" + esc(s) + "</li>").join("");
  const points = data.riskPoints.map(s => "<li>" + esc(s) + "</li>").join("");
  const channels = data.channels.map(c => '<div>' + (c.tel ? '<a href="tel:' + esc(c.tel) + '" style="color:inherit;text-decoration:none">' + esc(c.name) + '</a>' : esc(c.name)) + '<small>' + esc(c.note) + '</small></div>').join('');
  const never = data.notExecuted.map(s => "· " + esc(s)).join("<br>");
  $("out").innerHTML =
    '<div class="card ' + (data.risk === "high" ? "high" : "") + '">'
    + "<h2>" + esc(data.headline) + '<span class="badge">' + esc(risk) + "</span></h2>"
    + '<p style="color:#5d7287;font-size:14px">命中的要求：' + esc(data.matched.join("、")) + "</p>"
    + '<div class="sec"><h3>为什么可疑</h3><ul>' + points + "</ul></div>"
    + '<div class="sec"><h3>现在这么做</h3><ol>' + steps + "</ol></div>"
    + '<div class="sec"><h3>核实渠道（用自己找到的号码）</h3><div class="chs">' + channels + "</div></div>"
    + '<div class="never">' + never + "</div>"
    + '<p class="foot">' + esc(data.note) + "</p>"
    + "</div>";
}
  if (location.search.indexOf('demo') >= 0) { $('text').value = SAMPLE; $('go').click(); }
</script>
</body></html>
