<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>时光链 · 出行计划</title><link rel="stylesheet" href="/restart.css"><script src="/restart.js" defer></script></head><body><main class="phone"><header class="topbar"><button id="reset" class="circle" aria-label="新对话">×</button><h1 id="title">新对话</h1><button id="menu" class="circle" aria-label="菜单">☰</button></header><section id="messages" class="messages" aria-live="polite"><div id="empty" class="empty"><h2>想去哪里？</h2><p>聊聊目的地，一起准备轻松的出游。</p><button id="begin">🧳 帮我创建出行计划 ↵</button></div></section><nav class="tools"><button id="plan">＋ 创建计划</button><button id="import">♧ 智能解析</button><button id="exchange">⇄ 汇率换算</button></nav><footer><div id="notice" class="notice" role="status"></div><form id="form"><textarea id="input" aria-label="出游需求" rows="1" maxlength="2000" placeholder="发消息或按住说话"></textarea><div class="input-actions"><button id="attach" type="button" aria-label="添加图片">＋</button><div><button id="voice" type="button" aria-label="语音输入">♩</button><button id="send" type="submit" aria-label="发送">➤</button></div></div></form><p class="footnote">内容由 AI 辅助生成 · 重要信息请核实</p></footer><input id="file" type="file" accept="image/png,image/jpeg" hidden></main><dialog id="drawer"><header><h2>对话菜单</h2><button id="close-menu">×</button></header><button id="new">＋ 新建出行对话</button><button id="show-record">查看本次需求</button><p>本页先完成目的地、日期和偏好确认。介绍及表单提示为程序文案，不冒充模型生成。</p><pre id="record"></pre></dialog></body></html>
