server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8091}
spring.application.name=a1-guide
data.source=${DATA_SOURCE:mock}
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
ai.ollama.enabled=${OLLAMA_ENABLED:true}
ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
ai.ollama.model=qwen3.8-27b
ai.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:90}
# Model stays resident across demo pauses; 5m reloaded it and made the next question slow again.
ai.ollama.keep-alive=${OLLAMA_KEEP_ALIVE:30m}

spring.config.import=optional:file:./config/amap-local.properties
amap.web-key=${AMAP_WEB_KEY:}

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB

ai.model.provider=school
