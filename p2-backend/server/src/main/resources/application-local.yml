spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${MYSQL_PORT:3308}/${DB_NAME:silver_tourism_demo}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: ${DB_USER:silver_app}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true

server:
  address: 127.0.0.1

mybatis-plus:
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

app:
  notifications:
    mock-enabled: true
    mock-delay-ms: 2000
  security:
    mock-enabled: true

agents:
  mode: ${AGENTS_MODE:mock}

speech:
  mode: ${SPEECH_MODE:mock}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
